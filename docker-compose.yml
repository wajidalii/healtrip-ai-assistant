services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: healtrip
      POSTGRES_PASSWORD: healtrip
      POSTGRES_DB: healtrip
    ports:
      - "5432:5432"
    volumes:
      - healtrip_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healtrip"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  healtrip_pg:
